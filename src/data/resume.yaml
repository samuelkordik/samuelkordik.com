experience:
  - title: EMS Quality Manager
    org: Dallas Fire-Rescue Office of the Medical Director · Parkland/BioTel
    start: Jun 2023
    end: Present
    summary: Leading the Quality Management Division within the Dallas Fire-Rescue Office of the Medical Director and the Parkland/BioTel system.
  - title: Paramedic
    start: Mar 2023
    end: Jun 2023
    summary: Worked as a paramedic on a busy urban/suburban ambulance in a progressive EMS system, a welcome chance to get back to my roots and rekindle my passion for excellent patient care.
  - title: Director, Compliance, Quality, and Education
    start: Mar 2021
    end: Dec 2022
    summary: System-level focus on operational efficiency, quality, and compliance with accreditation standards and regulatory requirements. Led an organizational policy overhaul, built data pipelines and dashboards that streamlined billing and reduced documentation errors, and led our accredited education program.
  - title: Clinical Director
    start: Jun 2019
    end: Mar 2021
    summary: Executive-level leadership for education and quality of patient care in a large 911 EMS system with critical care transfer and fixed-wing flight programs. Built a quality management program and team from the ground up, grew the education team, used analytics to improve education outcomes, and designed dashboards and data visualization for quality of care.
  - title: Senior Clinical Supervisor
    start: "2016"
    end: "2019"
    summary: Responsible for the quality management program, employee continuing education, and accredited education programs. Applied data analytics to hiring, to deployment of life-saving treatments, and to organizational decisions. Introduced in-house audio/video production, built interactive online coursework, launched a podcast, and conducted clinical research.
  - title: Clinical Specialist
    start: "2014"
    end: "2019"
    summary: Coordinated QA/QI programs and taught continuing education. Developed and deployed analytics reports with SQL, Crystal Reports, R, and Tableau. Project manager for a major electronic health records transition, and author of a new 350-page clinical operating guidelines manual.
  - title: In-Charge Paramedic
    start: "2008"
    end: "2014"
    summary: Lead paramedic for ambulance crews in high-volume urban/suburban 911 systems and in rural 911 and interfacility transfer systems.

